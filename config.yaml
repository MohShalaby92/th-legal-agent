# TH Legal Review Assistant — profile config.
# The model/provider is deliberately NOT set: every member signs in with their own engine
# (`th-legal model` → Claude Opus 5.5 / ChatGPT Sol 5.6 / Sol 6).

plugins:
  enabled:
    - th-privacy-shield

# Privacy hardening -----------------------------------------------------------
security:
  redact_secrets: true
privacy:
  redact_pii: true
approvals:
  mode: manual          # every flagged shell command asks the user
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true  # memory writes need the user's OK
auxiliary:
  title_generation:     # no side-calls that would send conversation text to a model unmasked
    enabled: false
    model_upgrade_enabled: false
  background_review:
    enabled: false
curator:
  enabled: false

# Browser: attach to the member's own work browser ("TH Chrome (العمل)" shortcut, port 9222).
# Google refuses sign-in in agent-launched browsers; a normal Chrome/Edge window with its own
# work profile keeps the platform + Google logins. Started by `th.py browser start`.
browser:
  headed: true
  record_sessions: false
  use_real_profile: false
  cdp_url: http://127.0.0.1:9222
  inactivity_timeout: 1800   # don't close the browser while the user is signing in
  command_timeout: 60

# Pre-approved: the bundled read-only TH helpers (one fixed entry point, no shell operators allowed)
command_allowlist:
  - python ~/AppData/Local/TH-Legal/th.py *

display:
  language: ar

# Tools: no image/vision/screen tools (document images must never be sent to the model)
platform_toolsets:
  cli:
    - browser
    - clarify
    - file
    - terminal
    - todo
    - skills
    - memory
    - session_search
    - delegation
    - web
